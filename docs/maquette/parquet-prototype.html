:root{--red:#e30613;--ink:#111112;--muted:#626064;--line:#e6e3df;--paper:#f6f4f0;--head:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"DM Sans",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#101011;font:14px var(--body)}
button,input,textarea,select{font:inherit}
button,a{touch-action:manipulation}
button{cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3665ce;outline-offset:3px}
svg{width:20px;height:20px;vertical-align:middle;flex:none}
.shellbar{height:70px;border-bottom:1px solid #ffffff17;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;color:#fff;background:#101011}
.brand{display:flex;align-items:center;gap:10px;font:700 25px/.9 var(--head);letter-spacing:.025em}
.mark{width:36px;height:36px;display:grid;place-items:center;background:var(--red);color:white;border-radius:50%}
.mark svg{width:23px;height:23px}
.shellbar .brand small{font:700 9px var(--body);display:block;letter-spacing:.13em;margin-top:4px;color:#c9c4c4}.shellbar p,.shellbar button{color:#ceccca;font-size:12px}
.shellbar button,.lab button{background:none;border:1px solid #ffffff29;color:#fff;border-radius:8px;min-height:44px;padding:0 12px}
.studio{max-width:1440px;margin:auto;display:grid;grid-template-columns:minmax(210px,1fr) 414px minmax(205px,.8fr);gap:clamp(28px,5vw,82px);align-items:center;padding:40px 5vw 48px;min-height:calc(100dvh - 70px);background:radial-gradient(ellipse at 52% 48%,#2a1b1e,transparent 54%)}
.intro,.lab{color:white}
.kicker{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.16em}
.intro .kicker,.lab .kicker{color:#dfc1c3;display:flex;align-items:center;gap:10px}
.intro .kicker:before{content:"";width:24px;border-top:2px solid var(--red)}
.intro h1{font:700 clamp(60px,7.7vw,124px)/.78 var(--head);letter-spacing:-.015em;text-transform:uppercase;margin:25px 0}
.intro h1 span{color:#ff424d;display:block}
.intro p,.lab p{color:#c0bbbd;line-height:1.65;max-width:30ch}
.role-pick{display:grid;gap:7px;margin-top:26px}
.role-pick button{background:#ffffff08;border:1px solid #ffffff1c;color:#eee;border-radius:9px;min-height:48px;text-align:left;padding:0 13px;display:flex;gap:11px;align-items:center}
.role-pick button[aria-pressed=true]{background:#301518;border-color:#b92b36;color:#fff}
.role-pick button svg:last-child{margin-left:auto;width:16px}
.lab{border-top:1px solid #ffffff26;padding-top:20px}
.lab h2{font:700 33px/1 var(--head);margin:10px 0}
.lab select{width:100%;margin:10px 0;background:#1a191b;color:white;border:1px solid #ffffff33;border-radius:8px;min-height:44px;padding:8px}
.phone{height:clamp(635px,calc(100dvh - 148px),850px);min-width:0;position:relative;display:flex;flex-direction:column;border:7px solid #252427;outline:1px solid #ffffff22;border-radius:33px;background:var(--paper);overflow:hidden;box-shadow:0 22px 70px #0009;color:var(--ink)}
.appbar{background:#000;color:white;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 17px;min-height:65px;flex:none}
.appbar button{padding:0;background:none;border:none;color:inherit;min-height:44px;min-width:44px}
.appbar small{font:700 9px var(--body);display:block;letter-spacing:.12em;margin-top:5px;color:#c9c4c4}
.screen{overflow:auto;flex:1;overscroll-behavior:contain;scrollbar-width:thin;position:relative}
.screen>section{animation:enter .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:.1;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
.tabs{display:flex;flex:none;background:#000;color:#ddd;justify-content:space-around;padding:4px 5px max(6px,env(safe-area-inset-bottom))}
.tabs button{background:none;color:inherit;border:0;flex:1;min-width:0;min-height:53px;font-size:10px;display:grid;justify-items:center;align-content:center;gap:5px}

.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#0000 12%,#0003 35%,#000e 100%),linear-gradient(90deg,#0009,#0000 77%)}
.hero .flag{align-self:flex-start;padding:7px 9px;background:var(--red);margin-bottom:9px}
.hero h2{font:700 clamp(52px,13vw,66px)/.83 var(--head);text-transform:uppercase;margin:0 0 13px;max-width:7ch;letter-spacing:-.015em}
.hero p{margin:0;font-size:13px;color:#f3eeee}
.hero p svg{width:15px;margin-right:4px}
.hero.visit{min-height:350px}.hero.visit h2{max-width:9ch}
.pad{padding:19px 18px 23px}
h2.title{font:700 49px/.88 var(--head);text-transform:uppercase;letter-spacing:-.01em;margin:5px 0 14px;overflow-wrap:anywhere}
h3{font:700 29px/1 var(--head);margin:0}
p{line-height:1.55}
.sub{color:var(--muted);margin:0 0 17px}
.sectionline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 9px}
.btn{border-radius:9px;border:1px solid transparent;min-height:48px;padding:9px 13px;font-weight:700;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;background:var(--red);color:white;text-align:center}
.btn.secondary{background:#fff;color:var(--ink);border-color:#d6d0cb}
.btn.ghost{background:none;color:var(--ink);border-color:transparent;padding-inline:4px}
.btn.danger{background:#fff;color:#a40817;border-color:#e8c4c8}
.full{width:100%}
.stack{display:grid;gap:9px}
.row{display:flex;gap:11px;align-items:center;width:100%;min-height:69px;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.row strong{display:block;overflow-wrap:anywhere}
.row small{color:var(--muted);display:block;margin-top:3px}
.row>svg:last-child{margin-left:auto;width:17px}
.avatar,.datebox{width:49px;min-height:49px;flex:none;border-radius:8px;display:grid;place-content:center;text-align:center;background:#131214;color:white;font:700 24px/.95 var(--head)}
.datebox{background:#f3eeeb;color:#231d1e}.datebox small{font:700 9px var(--body);margin-top:2px}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:30px;background:#fae6e7;color:#9d0717;padding:5px 9px;font-size:11px;font-weight:700}
.banner{flex:none;background:#fff0cc;padding:9px 15px;color:#452b00;font-size:12px}
.banner strong{display:block}
.card{padding:15px;background:white;border:1px solid var(--line);border-radius:12px}
.card p:last-child{margin-bottom:0}
.field{display:grid;gap:6px;color:#2f2a2b;font-weight:700}
.field input,.field select,.field textarea,.search{width:100%;min-height:48px;background:#fff;border:1px solid #cfc8c3;border-radius:8px;padding:10px;color:#111}
.field textarea{min-height:90px;resize:vertical}
.field small{font-weight:400;color:var(--muted)}
.searchbox{position:relative;margin:0 0 12px}
.searchbox svg{position:absolute;top:13px;left:12px;color:var(--muted)}
.search{padding-left:41px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid #d9d3cc;background:white;border-radius:25px;min-height:48px;padding:5px 10px;color:#222}
.chips button[aria-pressed=true]{background:#161416;color:white;border-color:#161416}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.metric{background:#161416;color:#fff;padding:16px;border-radius:11px}
.metric strong{font:700 55px/.9 var(--head);display:block}
.metric p{margin:5px 0 0;color:#e0dadd}
.back{margin:-5px 0 10px}
.meta{display:grid;gap:10px;margin:16px 0;padding:0;list-style:none}
.meta li{display:flex;align-items:center;gap:9px}
.meta svg{color:#a50816}
.toast{position:absolute;z-index:4;bottom:67px;left:14px;right:14px;background:#201e20;border:1px solid #555;color:#fff;border-radius:9px;padding:12px;box-shadow:0 8px 20px #0005}
.toast:empty{display:none}
.splash{position:absolute;inset:0;z-index:5;background:#000;color:#fff;display:grid;place-content:center;text-align:center}
.splash[hidden]{display:none}
.splash .mark{margin:auto;width:75px;height:75px;animation:tip .65s cubic-bezier(.2,.8,.2,1) both}
.splash .mark svg{width:44px;height:44px}
.splash b{font:700 53px/.9 var(--head);letter-spacing:.035em;margin-top:12px}
.splash small{margin-top:9px}
.splash .load,.skeleton{border-radius:5px;background:linear-gradient(100deg,#ddd6d0 33%,#f8f5f1 50%,#ddd6d0 67%) 0/270%;animation:shimmer 1.3s linear infinite}
.splash .load{height:3px;margin:24px 20px 0;background-image:linear-gradient(100deg,#381719 33%,#ff4955 50%,#381719 67%)}
.skeleton{height:54px;margin:11px 0}
@keyframes tip{from{opacity:0;transform:translateY(18px) rotate(-55deg) scale(.8)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:160% 0}}
dialog{max-width:360px;width:calc(100% - 30px);border:1px solid var(--line);border-radius:15px;padding:19px;color:var(--ink);box-shadow:0 15px 60px #0008}
dialog[open]{animation:enter .22s cubic-bezier(.2,.8,.2,1) both}dialog::backdrop{background:#0009}.btn{transition:filter .14s,transform .14s}.btn:active{transform:scale(.98)}@media(hover:hover){.btn:hover{filter:brightness(.94)}.row:hover{border-color:#bfb3af}}
.mobile-tools{display:none}
@media(max-width:1060px){.studio{grid-template-columns:minmax(180px,1fr) 414px;max-width:850px}.lab{grid-column:1/-1;margin:0}.intro h1{font-size:clamp(59px,9vw,85px)}}
@media(max-width:690px){body{background:var(--paper)}.shellbar,.intro,.lab{display:none}.studio{display:block;padding:0;min-height:0}.phone{height:100dvh;border:0;outline:0;border-radius:0;box-shadow:none}.mobile-tools{display:inline-grid;place-items:center}.hero h2{font-size:60px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<header class="shellbar"><div class="brand" data-brand></div><p>Prototype interactif · Saison 2026 / 27</p><button data-act="splash">Rejouer le lancement</button></header>
<main class="studio">
<aside class="intro"><div class="kicker">Club partenaires · Basket</div><h1>Parquet<span>Club.</span></h1><p>Le réseau des entreprises qui font vivre le club.</p><div class="role-pick" id="roles" aria-label="Parcours de démonstration"></div></aside>
<div class="phone" aria-label="Maquette de l’application">
<header class="appbar"><div class="brand" data-brand></div><div id="topActions"></div></header>
<div id="banner" class="banner" hidden></div>
<div class="screen" id="screen" tabindex="-1"></div>
<nav class="tabs" id="tabs" aria-label="Navigation de l’application"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="splash" id="splash" role="status" hidden><span class="mark" data-ball></span><b>PARQUET.</b><small>Club partenaires</small><span class="load"></span></div>
</div>
<aside class="lab"><div class="kicker">Contrôles de la maquette</div><h2>Conditions réseau</h2><p>Essayez une réponse depuis le gymnase, puis revenez en ligne pour voir sa synchronisation.</p><label for="scenario">État simulé</label><select id="scenario"></select></aside>
</main>
<dialog id="modal" aria-labelledby="modalTitle"></dialog>
<script>
"use strict";
const $=id=>document.getElementById(id);
const art={
 ball:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3v18M6 5.5c6 3 6 10 0 13m12-13c-6 3-6 10 0 13"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-14 5h3m4 0h3"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 7 0 0 1 16 0"/>', shield:'<path d="M12 22c6-3 8-6 8-12V5l-8-3-8 3v5c0 6 2 9 8 12Z"/><path d="m9 12 2 2 4-4"/>',
 arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>', back:'<path d="M20 12H5m6-6-6 6 6 6"/>', pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
 search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>', bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 8-3 8h18s-3-1-3-8m-8 12a2 2 0 0 0 4 0"/>',
 sliders:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor"/><circle cx="15" cy="17" r="2" fill="currentColor"/>',
 check:'<path d="m5 12 4 4L19 6"/>', phone:'<path d="M5 3H8l2 5-2 2a13 13 0 0 0 6 6l2-2 5 2v3c0 2-2 3-3 2C9 20 4 15 3 6c0-1 0-3 2-3Z"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
 globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
const icon=k=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+art[k]+'</svg>';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=v=>v.normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
const partnerSeed=[
 {id:'martin',name:'Atelier Martin',category:'Artisanat',job:'Menuiserie & agencement',city:'Limoges',address:'12 rue des Ateliers',phone:'+1 202 555 0147',email:'contact@atelier-martin.example',website:'https://atelier-martin.example',description:'Aménagement sur mesure, mobilier et rénovation pour les professionnels et les particuliers.'},
 {id:'cap',name:'Cap Conseil',category:'Services',job:'Expertise comptable',city:'Panazol',address:'8 avenue du Parc',phone:'',email:'contact@cap-conseil.example',website:'',description:'Accompagnement comptable et conseil aux entreprises locales.'},
 {id:'grain',name:'Grain & Match',category:'Restauration',job:'Torréfacteur & café',city:'Limoges',address:'17 rue du Marché',phone:'',email:'contact@grain-match.example',website:'',description:'Cafés de spécialité torréfiés en petite série et événements autour du café.'},
 {id:'studio',name:'Studio Traverse',category:'Services',job:'Architecture d’intérieur',city:'Isle',address:'4 rue de la Mairie',phone:'',email:'contact@traverse.example',website:'',description:'Conception d’espaces de travail et de commerces.'}
];
const eventSeed=[
 {id:'loge',title:'Soirée en loge',type:'Match en loge',date:'2026-12-04',time:'19:30',place:'Palais des Sports · Limoges',description:'Retrouvez les partenaires du club autour d’un cocktail avant le match, puis profitez de la rencontre depuis la loge. Accueil à l’entrée principale.',guests:[['Cap Conseil',3],['Grain & Match',2],['Studio Traverse',0]]},
 {id:'after',title:'Afterwork du club',type:'Afterwork',date:'2026-12-17',time:'18:45',place:'Salon des partenaires',description:'Une rencontre entre chefs d’entreprise du territoire. Présentez votre activité et découvrez les autres membres du réseau.',guests:[['Cap Conseil',2]]},
 {id:'voeux',title:'Vœux au parquet',type:'Soirée partenaires',date:'2027-01-14',time:'19:00',place:'Club-house',description:'Présentation du calendrier et échange avec le bureau.',guests:[]}
];
function read(key,fallback){try{return JSON.parse(localStorage.getItem('parquet.'+key))??fallback}catch{return fallback}}
function save(){try{for(const key of ['partners','events','answers','privatePhone','reminder','notices','audit']) localStorage.setItem('parquet.'+key,JSON.stringify(state[key]))}catch{}}
const state={role:'partner',page:'events',id:null,query:'',category:'Tous',scenario:'ready',partners:read('partners',partnerSeed),events:read('events',eventSeed),answers:read('answers',{}),privatePhone:read('privatePhone',''),reminder:read('reminder',false),notices:read('notices',[{title:'Invitation · Soirée en loge',detail:'4 décembre · Palais des Sports',id:'loge'}]),audit:read('audit',[])};
const roles={visitor:['Visiteur','grid'],partner:['Partenaire','user'],staff:['Bureau','shield']};
const scenarios={ready:'En ligne',offline:'Hors connexion',loading:'Chargement',error:'Erreur réseau',empty:'Liste vide'};
const networkPages=['directory','partner','events','event'];
const btn=(label,act,cls='',k='')=>'<button type="button" class="btn '+cls+'" data-act="'+esc(act)+'">'+(k?icon(k):'')+esc(label)+'</button>';
const field=(label,name,value='',type='text',extra='')=>'<label class="field">'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+extra+'></label>';
const area=(label,name,value,extra='')=>'<label class="field">'+label+'<textarea name="'+name+'" '+extra+'>'+esc(value)+'</textarea></label>';
const select=(label,name,values,value)=>'<label class="field">'+label+'<select name="'+name+'">'+values.map(v=>'<option'+(v===value?' selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>';
const dateParts=date=>{const [y,m,d]=date.split('-');return [d,new Intl.DateTimeFormat('fr-FR',{month:'short',timeZone:'UTC'}).format(new Date(Date.UTC(+y,+m-1,+d))).replace('.','').toUpperCase()]};
const longDate=date=>new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(date+'T12:00:00Z'));
const confirmedAnswer=id=>{const answer=state.answers[id];return answer?.pending?answer.previous??null:answer?.count??null};
const count=e=>e.guests.reduce((n,g)=>n+g[1],0)+(confirmedAnswer(e.id)||0);
const fallback=(title,copy,action='')=>'<div class="card"><h3>'+esc(title)+'</h3><p>'+esc(copy)+'</p>'+action+'</div>';
const go=(page,id=null)=>{state.page=page;state.id=id;render();$('screen').focus({preventScroll:true})};
function switchRole(role){
 const available=state.partners.some(p=>p.id==='martin'&&!p.disabled);
 if(role==='partner'&&!available){state.role='visitor';go('login');notify('Accès partenaire désactivé ou supprimé.');return}
 state.role=role;state.query='';state.category='Tous';
 go(role==='visitor'?'welcome':role==='staff'?'admin':'events');
}
function notify(msg){clearTimeout(notify.timer);$('toast').textContent=msg;notify.timer=setTimeout(()=>$('toast').textContent='',3200)}
function splash(){
 const view=$('splash');clearTimeout(splash.timer);view.hidden=false;
 splash.timer=setTimeout(()=>view.hidden=true,matchMedia('(prefers-reduced-motion: reduce)').matches?180:1000);
}
function row(inner,act,k='arrow'){return '<button class="row" type="button" data-act="'+esc(act)+'">'+inner+icon(k)+'</button>'}
function initials(name){return name.trim().split(/\s+/).slice(0,2).map(n=>n[0]).join('')}
const logo=p=>p.logo?'<span class="avatar"><img alt="" src="'+esc(/^data:image\/(png|jpeg|webp);base64,/.test(p.logo)?p.logo:'')+'" style="width:43px;height:43px;object-fit:contain"></span>':'<span class="avatar" aria-hidden="true">'+esc(initials(p.name))+'</span>';
function partnerRows(list,staff=false){return list.map(p=>row(logo(p)+'<span><strong>'+esc(p.name)+'</strong><small>'+esc(staff&&p.disabled?'Accès désactivé':p.job+' · '+p.city)+'</small></span>',(staff?'managePartner:':'partner:')+p.id)).join('')}
function eventRows(list,staff=false){return list.map(e=>{const [d,m]=dateParts(e.date);return row('<span class="datebox">'+d+'<small>'+m+'</small></span><span><strong>'+esc(e.title)+'</strong><small>'+esc(e.cancelled?'Annulé':staff?count(e)+' participants':e.type+' · '+e.time.replace(':',' h '))+'</small></span>',(staff?'manageEvent:':'event:')+e.id)}).join('')}
function hero(e){return '<div class="hero"><span class="flag kicker">Prochaine invitation</span><h2>'+esc(e.title)+'</h2><p>'+icon('cal')+esc(longDate(e.date)+' · '+e.time.replace(':',' h '))+'</p></div>'}
function heading(title,sub=''){return '<h2 class="title">'+esc(title)+'</h2>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'')}
function back(page,label){return '<div class="back">'+btn(label,page,'ghost','back')+'</div>'}
function appNav(){
 const items=state.role==='visitor'?[['welcome','Club','ball'],['directory','Annuaire','grid'],['login','Connexion','user']]:[['directory','Annuaire','grid'],['events','Événements','cal'],['profile','Mon profil','user'],...(state.role==='staff'?[['admin','Administration','shield']]:[])];
 const groups={partner:'directory',event:'events',editProfile:'profile',adminPartners:'admin',adminEvents:'admin',managePartner:'admin',manageEvent:'admin',eventForm:'admin',invite:'admin',audit:'admin'};
 $('tabs').innerHTML=items.map(([page,label,k])=>'<button data-act="'+page+'" '+((groups[state.page]||state.page)===page?'aria-current="page"':'')+'>'+icon(k)+esc(label)+'</button>').join('');
}
function controls(){
 const roleButtons=Object.entries(roles).map(([role,[label,k]])=>'<button data-act="role:'+role+'" aria-pressed="'+(state.role===role)+'">'+icon(k)+label+icon('arrow')+'</button>').join('');
 $('roles').innerHTML=roleButtons;
 $('scenario').innerHTML=Object.entries(scenarios).map(([value,label])=>'<option value="'+value+'" '+(state.scenario===value?'selected':'')+'>'+label+'</option>').join('');
 $('topActions').innerHTML=(state.role==='partner'?'<button data-act="notifications" aria-label="Notifications">'+icon('bell')+'</button>':'')+'<button class="mobile-tools" data-act="tools" aria-label="Contrôles de la maquette">'+icon('sliders')+'</button>';
 const banner=$('banner');banner.hidden=state.scenario!=='offline';
 banner.innerHTML='<strong>Hors connexion</strong>Données de démonstration mises en cache.';
 appNav();
}
function directoryResults(){
 const term=normalize(state.query.trim());
 const list=state.scenario==='empty'?[]:state.partners.filter(p=>!p.disabled&&(state.category==='Tous'||p.category===state.category)&&normalize([p.name,p.job,p.city].join(' ')).includes(term));
 $('directoryResults').innerHTML=list.length?'<div class="kicker sub">'+list.length+' entreprise'+(list.length>1?'s':'')+'</div><div class="stack">'+partnerRows(list)+'</div>':fallback(term||state.category!=='Tous'?'Aucun résultat':'Aucun partenaire',term||state.category!=='Tous'?'Essayez un autre nom, métier ou lieu.':'Les entreprises du club apparaîtront ici.',term||state.category!=='Tous'?btn('Effacer les filtres','clear','secondary'):'');
}
function eventsList(){
 const list=(state.scenario==='empty'?[]:state.events).slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 const next=list.find(e=>!e.cancelled);
 if(!next)return '<div class="pad">'+heading('Événements')+(list.length?'<div class="stack">'+eventRows(list)+'</div>':fallback('Aucun événement à venir','Les prochaines invitations apparaîtront ici.'))+'</div>';
 const reply=state.answers[next.id];
 const rest=list.filter(e=>e.id!==next.id);
 return hero(next)+'<div class="pad"><p class="sub">'+icon('pin')+' '+esc(next.place)+'</p>'+btn(reply?'Voir ma réponse':'Répondre à l’invitation','event:'+next.id,'full','arrow')+(rest.length?'<div class="sectionline"><h3>À suivre</h3></div><div class="stack">'+eventRows(rest)+'</div>':'')+'</div>';
}
function detailEvent(e){
 const reply=state.answers[e.id];
 const replyPanel=state.role==='partner'&&!e.cancelled?'<div class="stack"><h3>Votre participation</h3>'+(reply?'<div class="card"><span class="tag">'+(reply.count?'Confirmé · '+reply.count+' personne'+(reply.count===1?'':'s'):'Absent')+'</span><p>'+esc(reply.pending?'En attente de synchronisation.':reply.count&&state.reminder?'Rappel prévu deux jours avant.':'Réponse enregistrée dans la maquette.')+'</p></div>':'')+btn(reply?.count?'Modifier le nombre de personnes':'Je viens','attend:'+e.id,'full','check')+btn('Je ne viens pas','decline:'+e.id,'secondary full')+'</div>':'';
 return '<div class="pad">'+back('events','Événements')+'<span class="tag">'+esc(e.cancelled?'Annulé':e.type)+'</span>'+heading(e.title)+'<ul class="meta"><li>'+icon('cal')+esc(longDate(e.date))+'</li><li>'+icon('clock')+esc(e.time.replace(':',' h '))+'</li><li>'+icon('pin')+esc(e.place)+'</li></ul><p class="sub">'+esc(e.description)+'</p>'+replyPanel+'</div>';
}
function detailPartner(p){
 const actions=[];
 if(p.phone)actions.push(['Appeler','tel:'+p.phone.replace(/[^\d+]/g,''),'phone']);
 if(p.email)actions.push(['Écrire','mailto:'+p.email,'mail']);
 if(/^https?:\/\//i.test(p.website))actions.push(['Site web',p.website,'globe']);
 if(p.address||p.city)actions.push(['Itinéraire','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address+' '+p.city),'pin']);
 return '<div class="pad">'+back('directory','Annuaire')+logo(p)+'<p class="kicker">'+esc(p.category)+'</p>'+heading(p.name,p.job)+'<p>'+esc(p.description)+'</p><ul class="meta"><li>'+icon('pin')+esc([p.address,p.city].filter(Boolean).join(' · '))+'</li></ul><div class="actions">'+actions.map(([label,url,k])=>'<a class="btn secondary" href="'+esc(url)+'" '+(url.startsWith('http')?'target="_blank" rel="noopener"':'')+'>'+icon(k)+esc(label)+'</a>').join('')+'</div></div>';
}
function profileForm(){
 const p=state.partners.find(p=>p.id==='martin');
 if(!p||p.disabled)return '<div class="pad">'+heading('Ma fiche')+fallback('Fiche indisponible','Le bureau peut rétablir l’accès à votre fiche.')+'</div>';
 return '<div class="pad">'+back('profile','Mon profil')+heading('Ma fiche')+'<form class="stack" data-form="profile">'+field('Entreprise','name',p.name,'text','required maxlength="70"')+select('Secteur','category',['Artisanat','Services','Restauration','Autre'],p.category)+field('Métier','job',p.job,'text','required maxlength="70"')+area('Présentation','description',p.description,'maxlength="420"')+field('Adresse','address',p.address)+field('Ville','city',p.city,'text','required')+field('Téléphone professionnel','phone',p.phone,'tel')+field('E-mail professionnel','email',p.email,'email')+field('Site web','website',p.website,'url')+'<label class="field">Logo<input type="file" name="logo" accept="image/png,image/jpeg,image/webp"><small>PNG, JPEG ou WebP · 1 Mo maximum.</small></label><label class="field">Téléphone personnel<input name="privatePhone" type="tel" value="'+esc(state.privatePhone)+'"><small>Visible uniquement par le bureau dans l’application cible.</small></label><button class="btn full">Enregistrer</button></form></div>';
}
function eventForm(e){
 return '<div class="pad">'+back(e?'manageEvent:'+e.id:'adminEvents','Retour')+heading(e?'Modifier l’événement':'Nouvel événement')+'<form class="stack" data-form="event" data-id="'+esc(e?.id||'')+'">'+field('Titre','title',e?.title,'text','required maxlength="65"')+select('Type','type',['Match en loge','Afterwork','Soirée partenaires'],e?.type)+field('Date','date',e?.date,'date','required')+field('Heure','time',e?.time,'time','required')+field('Lieu','place',e?.place,'text','required maxlength="100"')+area('Description','description',e?.description,'required maxlength="500"')+'<button class="btn full">'+(e?'Enregistrer':'Créer l’événement')+'</button></form></div>';
}
function manageEvent(e){
 const guests=[...e.guests];
 const a=confirmedAnswer(e.id);
 if(a!==null)guests.unshift([state.partners.find(p=>p.id==='martin')?.name||'Atelier Martin',a]);
 const confirmed=guests.reduce((n,g)=>n+g[1],0);
 return '<div class="pad">'+back('adminEvents','Gérer les événements')+'<span class="tag">'+esc(e.cancelled?'Annulé':e.type)+'</span>'+heading(e.title,longDate(e.date)+' · '+e.place)+'<div class="stack"><div class="metric"><strong>'+confirmed+'</strong><p>participants confirmés</p></div>'+(!e.cancelled?btn('Modifier l’événement','eventForm:'+e.id,'secondary full'):'')+'<h3>Réponses reçues</h3>'+(guests.length?guests.map(([name,n])=>'<div class="card"><strong>'+esc(name)+'</strong> · '+(n?n+' personne'+(n>1?'s':''):'Absent')+'</div>').join(''):fallback('Aucune réponse','Les réponses des partenaires apparaîtront ici.'))+(!e.cancelled?btn('Annuler l’événement','cancelEvent:'+e.id,'danger full'):'')+'</div></div>';
}
function renderPage(){
 const {role,page,id,scenario}=state;
 const e=state.events.find(e=>e.id===id);
 const p=state.partners.find(p=>p.id===id);
 if(networkPages.includes(page)&&scenario==='loading')return '<section class="pad" aria-busy="true">'+heading(page.includes('event')?'Événements':'Annuaire')+'<p class="sub" role="status">Chargement de la liste…</p><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>'+btn('Terminer la simulation','retry','secondary')+'</section>';
 if(networkPages.includes(page)&&scenario==='error')return '<section class="pad">'+heading(page.includes('event')?'Événements':'Annuaire')+fallback('Impossible de charger','La connexion au réseau a échoué.',btn('Réessayer','retry','full'))+'</section>';
 let body='';
 switch(page){
 case 'welcome':body='<div class="hero visit"><span class="flag kicker">Le réseau du club</span><h2>Le club se joue ensemble.</h2></div><div class="pad stack"><p class="sub">Rencontrez les entreprises locales qui soutiennent notre club de basket.</p>'+btn('Voir les partenaires','directory','full','arrow')+btn('Se connecter','login','secondary full')+'</div>';break;
 case 'login':body='<div class="pad stack">'+back('welcome','Accueil')+heading('Connexion','Utilisez l’accès transmis par le bureau.')+'<form class="stack" data-form="login">'+field('E-mail','email','','email','required autocomplete="username"')+field('Mot de passe','password','','password','required autocomplete="current-password"')+'<button class="btn full">Se connecter</button></form>'+btn('Mot de passe oublié','forgot','ghost')+'<div class="card"><strong>Accès de démonstration</strong><p>Ouvrez un rôle pour essayer la maquette sans identifiants.</p><div class="actions">'+btn('Partenaire','role:partner','secondary')+btn('Bureau','role:staff','secondary')+'</div></div></div>';break;
 case 'forgot':body='<div class="pad">'+back('login','Connexion')+heading('Mot de passe oublié')+'<form class="stack" data-form="forgot">'+field('E-mail du compte','email','','email','required')+'<button class="btn full">Demander un lien</button></form></div>';break;
 case 'directory':body='<div class="pad">'+heading('Annuaire','Trouvez un métier dans le réseau du club.')+'<div class="searchbox">'+icon('search')+'<input class="search" id="query" aria-label="Rechercher un partenaire" placeholder="Nom, métier ou ville" value="'+esc(state.query)+'"></div><div class="chips">'+['Tous','Artisanat','Services','Restauration','Autre'].map(c=>'<button type="button" data-act="category:'+c+'" aria-pressed="'+(state.category===c)+'">'+c+'</button>').join('')+'</div><div id="directoryResults" aria-live="polite"></div><div style="margin-top:15px">'+btn('Confidentialité','privacy','ghost')+'</div></div>';break;
 case 'partner':body=p&&!p.disabled?detailPartner(p):'<div class="pad">'+back('directory','Annuaire')+fallback('Fiche indisponible','Cette fiche n’est plus disponible.')+'</div>';break;
 case 'events':body=eventsList();break;
 case 'event':body=e?detailEvent(e):'<div class="pad">'+back('events','Événements')+fallback('Événement introuvable','Retournez à l’agenda.')+'</div>';break;
 case 'profile':body='<div class="pad stack">'+heading('Mon profil',role==='staff'?'Compte du bureau':'Espace partenaire')+(role==='partner'?row(logo(state.partners.find(p=>p.id==='martin')||partnerSeed[0])+'<span><strong>Ma fiche publique</strong><small>Modifier mes informations</small></span>','editProfile')+row(icon('bell')+'<span><strong>Rappel avant un événement</strong><small>'+(state.reminder?'Activé · 2 jours avant':'Désactivé')+'</small></span>','reminder'):row(icon('shield')+'<span><strong>Verrouillage du bureau</strong><small>Aperçu biométrique</small></span>','biometric'))+btn('Confidentialité','privacy','secondary full')+btn('Se déconnecter','logout','danger full')+'</div>';break;
 case 'editProfile':body=profileForm();break;
 case 'notifications':body='<div class="pad stack">'+back('events','Événements')+heading('Notifications')+(state.notices.length?state.notices.map(n=>row(icon('bell')+'<span><strong>'+esc(n.title)+'</strong><small>'+esc(n.detail)+'</small></span>','event:'+n.id)).join(''):fallback('Aucune notification','Les invitations et changements apparaîtront ici.'))+'</div>';break;
 case 'admin':body='<div class="pad stack">'+heading('Le bureau','Gérez le réseau depuis votre téléphone.')+'<div class="metric"><strong>'+state.partners.filter(p=>!p.disabled).length+'</strong><p>partenaires actifs</p></div>'+row(icon('grid')+'<span><strong>Gérer les partenaires</strong><small>Invitations et accès</small></span>','adminPartners')+row(icon('cal')+'<span><strong>Gérer les événements</strong><small>Programmation et réponses</small></span>','adminEvents')+row(icon('shield')+'<span><strong>Journal des actions</strong><small>Historique de la démonstration</small></span>','audit')+'</div>';break;
 case 'adminPartners':body='<div class="pad stack">'+back('admin','Le bureau')+heading('Partenaires')+btn('Inviter un partenaire','invite','full')+partnerRows(state.partners,true)+'</div>';break;
 case 'invite':body='<div class="pad">'+back('adminPartners','Partenaires')+heading('Inviter un partenaire')+'<form class="stack" data-form="invite">'+field('Entreprise','name','','text','required maxlength="70"')+field('E-mail d’invitation','email','','email','required')+'<button class="btn full">Créer l’invitation</button></form></div>';break;
 case 'managePartner':if(p)body='<div class="pad stack">'+back('adminPartners','Partenaires')+heading(p.name,p.disabled?'Accès désactivé':'Compte actif')+'<div class="card"><strong>Coordonnées réservées au bureau</strong><p>'+esc(p.inviteEmail||'Adresse d’invitation non renseignée')+(p.id==='martin'&&state.privatePhone?'<br>Tél. personnel · '+esc(state.privatePhone):'')+'</p></div>'+btn('Réinitialiser le mot de passe','reset:'+p.id,'secondary full')+btn(p.disabled?'Réactiver l’accès':'Désactiver l’accès','disable:'+p.id,'danger full')+btn('Supprimer le partenaire','delete:'+p.id,'danger full')+'</div>';break;
 case 'adminEvents':body='<div class="pad stack">'+back('admin','Le bureau')+heading('Événements')+btn('Créer un événement','eventForm','full')+eventRows(state.events,true)+'</div>';break;
 case 'manageEvent':if(e)body=manageEvent(e);break;
 case 'eventForm':body=eventForm(e);break;
 case 'audit':body='<div class="pad stack">'+back('admin','Le bureau')+heading('Journal des actions')+(state.audit.length?state.audit.map(a=>'<div class="card"><strong>'+esc(a.label)+'</strong><p>'+esc(a.when)+'</p></div>').join(''):fallback('Aucune action enregistrée','Créez un événement ou modifiez un accès pour commencer.'))+'</div>';break;
 case 'privacy':body='<div class="pad">'+back(role==='visitor'?'directory':'profile','Retour')+heading('Confidentialité')+'<div class="card"><p>L’annuaire affiche les coordonnées professionnelles choisies par l’entreprise. Le téléphone personnel est réservé au bureau.</p><p>Pour faire rectifier ou supprimer vos données, contactez le bureau du club.</p><p>Les données saisies dans cette maquette restent dans le navigateur. Utilisez des coordonnées fictives.</p></div></div>';break;
 }
 return '<section>'+(body||'<div class="pad">'+fallback('Contenu indisponible','Revenez à l’écran précédent.')+'</div>')+'</section>';
}
function render(){
 controls();$('screen').innerHTML=renderPage();$('screen').scrollTop=0;
 if($('directoryResults'))directoryResults();
}
document.querySelectorAll('[data-brand]').forEach(el=>el.innerHTML='<span class="mark">'+icon('ball')+'</span><span>PARQUET.<small>CLUB PARTENAIRES</small></span>');
document.querySelector('[data-ball]').innerHTML=icon('ball');
function dialog(title,content){
 const modal=$('modal');
 modal.innerHTML='<h3 id="modalTitle">'+esc(title)+'</h3>'+content;
 if(!modal.open)modal.showModal();
}
function confirmAction(title,copy,action,label='Confirmer'){
 dialog(title,'<p>'+esc(copy)+'</p><div class="actions">'+btn('Retour','close','secondary')+btn(label,action)+'</div>');
}
function log(label){state.audit.unshift({label,when:new Date().toLocaleString('fr-FR',{timeZone:'Europe/Paris'})})}
function notice(e,verb){state.notices.unshift({title:verb+' · '+e.title,detail:longDate(e.date)+' · '+e.place,id:e.id})}
function setScenario(value){
 state.scenario=value;
 if(value==='ready'){
  const queued=Object.values(state.answers).filter(x=>x.pending);
  queued.forEach(x=>x.pending=false); save();
  if(queued.length)notify('Réponse synchronisée dans la maquette.');
 }
 render();
}
function writeAnswer(id,n){
 const pending=state.scenario==='offline';
 state.answers[id]={count:n,pending,previous:pending?confirmedAnswer(id):null};
 save();$('modal').close();render();notify(state.answers[id].pending?'Réponse mise en attente.':'Réponse enregistrée.');
}
function toolsDialog(){
 dialog('Contrôles de la maquette','<div class="stack" style="margin-top:12px">'+Object.entries(roles).map(([r,[label]])=>btn(label,'role:'+r,'secondary')).join('')+'<label class="field">État simulé<select id="mobileScenario">'+Object.entries(scenarios).map(([v,l])=>'<option value="'+v+'" '+(v===state.scenario?'selected':'')+'>'+l+'</option>').join('')+'</select></label>'+btn('Rejouer le lancement','splash','secondary')+btn('Fermer','close','ghost')+'</div>');
}
const staffActions=['admin','adminPartners','adminEvents','audit','invite','managePartner','manageEvent','eventForm','reset','disable','doDisable','delete','doDelete','cancelEvent','doCancel','biometric'];
const connectedPages=['events','event','profile'];
const pages=['welcome','directory','partner','login','forgot','events','event','profile','editProfile','notifications','admin','adminPartners','adminEvents','audit','invite','managePartner','manageEvent','eventForm','privacy'];
document.addEventListener('click',ev=>{
 const target=ev.target.closest('[data-act]');
 if(!target)return;
 const [action,id]=target.dataset.act.split(':');
 if((staffActions.includes(action)&&state.role!=='staff')||(connectedPages.includes(action)&&state.role==='visitor'))return;
 if(['attend','decline','doDecline','editProfile','reminder','notifications'].includes(action)&&state.role!=='partner')return;
 const modal=$('modal');
 const p=state.partners.find(x=>x.id===id);
 const e=state.events.find(x=>x.id===id);
 if(pages.includes(action)){go(action,id);return}
 switch(action){
 case 'role':if(modal.open)modal.close();switchRole(id);break;
 case 'tools':toolsDialog();break;
 case 'splash':if(modal.open)modal.close();splash();break;
 case 'close':modal.close();break;
 case 'retry':setScenario('ready');break;
 case 'category':state.category=id;document.querySelectorAll('.chips button').forEach(b=>b.setAttribute('aria-pressed',String(b===target)));directoryResults();break;
 case 'clear':state.query='';state.category='Tous';render();$('query').focus();break;
 case 'attend':if(e&&!e.cancelled)dialog('Combien de personnes ?', '<p>Indiquez le total, vous compris.</p><form class="stack" data-form="rsvp" data-id="'+esc(id)+'">'+field('Nombre de personnes','count',state.answers[id]?.count||1,'number','min="1" step="1" required')+'<button class="btn full">Confirmer ma présence</button>'+btn('Fermer','close','ghost')+'</form>');break;
 case 'decline':if(e&&!e.cancelled)confirmAction('Décliner l’invitation ?',e.title,'doDecline:'+id,'Je ne viens pas');break;
 case 'doDecline':if(e&&!e.cancelled)writeAnswer(id,0);break;
 case 'reminder':state.reminder=!state.reminder;save();render();notify(state.reminder?'Rappels activés dans la maquette.':'Rappels désactivés.');break;
 case 'logout':confirmAction('Se déconnecter ?','Vous reviendrez sur l’accueil public.','doLogout','Se déconnecter');break;
 case 'doLogout':modal.close();switchRole('visitor');break;
 case 'biometric':dialog('Vérification du bureau','<p>L’application native affichera le contrôle d’empreinte ou de visage du téléphone.</p>'+btn('Continuer la démonstration','close','full'));break;
 case 'reset':if(p)confirmAction('Réinitialiser le mot de passe ?','Un lien serait adressé au compte partenaire.','doReset:'+id,'Simuler l’envoi');break;
 case 'doReset':if(p&&state.role==='staff'){modal.close();log('Réinitialisation simulée · '+p.name);save();notify('Envoi simulé.')}break;
 case 'disable':if(p)confirmAction(p.disabled?'Réactiver l’accès ?':'Désactiver l’accès ?',p.name,'doDisable:'+id);break;
 case 'doDisable':if(p){p.disabled=!p.disabled;log((p.disabled?'Accès désactivé · ':'Accès réactivé · ')+p.name);save();modal.close();render();}break;
 case 'delete':if(p)confirmAction('Supprimer ce partenaire ?','Sa fiche et ses réponses seront retirées de la démonstration.','doDelete:'+id,'Supprimer');break;
 case 'doDelete':if(p){state.partners=state.partners.filter(x=>x.id!==id);for(const x of state.events)x.guests=x.guests.filter(g=>g[0]!==p.name);if(id==='martin'){state.privatePhone='';state.answers={};state.reminder=false}log('Compte supprimé');save();modal.close();go('adminPartners');}break;
 case 'cancelEvent':if(e)confirmAction('Annuler cet événement ?',e.title+' · les partenaires verront le changement dans les notifications de démo.','doCancel:'+id,'Annuler l’événement');break;
 case 'doCancel':if(e&&!e.cancelled){e.cancelled=true;notice(e,'Annulé');log('Événement annulé · '+e.title);save();modal.close();render();}break;
 }
});
document.addEventListener('input',ev=>{if(ev.target.id==='query'){state.query=ev.target.value;directoryResults()}});
document.addEventListener('change',ev=>{
 if(['scenario','mobileScenario'].includes(ev.target.id)){if($('modal').open)$('modal').close();setScenario(ev.target.value)}
});
document.addEventListener('submit',async ev=>{
 ev.preventDefault();
 const form=ev.target;
 const data=Object.fromEntries(new FormData(form));
 const e=state.events.find(x=>x.id===form.dataset.id);
 const p=state.partners.find(x=>x.id==='martin'&&!x.disabled);
 switch(form.dataset.form){
 case 'login':form.reset();notify('Pour essayer la maquette, choisissez un accès de démonstration.');break;
 case 'forgot':go('login');notify('Demande simulée. Dans l’app, un lien est envoyé si le compte existe.');break;
 case 'rsvp':if(state.role==='partner'&&e&&!e.cancelled&&Number.isSafeInteger(+data.count)&&+data.count>0)writeAnswer(e.id,+data.count);break;
 case 'profile':{
  if(!p||state.role!=='partner')break;
  const {logo,privatePhone,...values}=data;
  if(values.website&&!/^https?:\/\//i.test(values.website)){notify('Utilisez une adresse de site en http ou https.');break}
  if(logo.size){
   if(logo.size>1048576||!['image/png','image/jpeg','image/webp'].includes(logo.type)){notify('Choisissez un logo PNG, JPEG ou WebP de 1 Mo maximum.');break}
   const reader=new FileReader();
   try{values.logo=await new Promise((resolve,reject)=>{reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(logo)})}catch{notify('Le fichier n’a pas pu être lu.');break}
  }
  Object.assign(p,values);state.privatePhone=privatePhone;save();go('profile');notify('Fiche enregistrée.');break
 }
 case 'invite':{
  if(state.role!=='staff')break;
  if(state.partners.some(p=>[p.inviteEmail,p.email].some(email=>email?.toLowerCase()===data.email.toLowerCase()))){notify('Un partenaire utilise déjà cette adresse.');break}
  state.partners.push({id:'p'+Date.now(),name:data.name,inviteEmail:data.email,category:'Autre',job:'Fiche à compléter',city:'',email:'',website:'',address:'',phone:'',description:'Présentation à compléter.'});
  log('Invitation créée · '+data.name);save();go('adminPartners');notify('Invitation créée dans la maquette.');break
 }
 case 'event':{
  if(state.role!=='staff')break;
  const item=e||{id:'e'+Date.now(),guests:[]};
  Object.assign(item,data);
  if(!e)state.events.push(item);
  notice(item,e?'Modifié':'Invitation');log((e?'Événement modifié · ':'Événement créé · ')+item.title);
  save();go('manageEvent',item.id);notify('Événement enregistré.');break
 }
 }
});
render();
splash();
</script>
</body>
</html>
