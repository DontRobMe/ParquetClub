# Pipeline mobile (cours 6) : vérifier → tester → construire → signer → livrer.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  verifier:
    name: Analyse et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --line-length 120 --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android
    needs: verifier
    runs-on: ubuntu-latest
    env:
      # Secrets du dépôt (Settings > Secrets > Actions). Sans eux, le build est signé avec la clé de debug.
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Clé de signature (depuis les secrets, jamais dans Git)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      # Version : nom dans pubspec.yaml, numéro de build = numéro du run (toujours croissant, exigé par les stores).
      # Obfuscation + symboles à part : binaire plus dur à lire, traces de plantage toujours décodables.
      - run: >
          flutter build appbundle --release
          --build-number=${{ github.run_number }}
          --obfuscate --split-debug-info=build/symboles
      - uses: actions/upload-artifact@v4
        with:
          name: parquet-android-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symboles
          retention-days: 30

  ios:
    name: Build iOS (sans signature)
    needs: verifier
    # Personne dans l'équipe n'a de Mac : la CI vérifie au moins que l'app iOS compile.
    # Seulement sur main, les minutes macOS coûtent cher.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
